name: silencexx
description: "SilenceXX — mental wellbeing, journal and AI companion."
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.4.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  record: ^6.1.0
  audioplayers: ^6.5.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_tts: ^4.2.3
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  share_plus: ^12.0.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/cloudmind_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/cloudmind_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#170D2E"
  adaptive_icon_foreground: assets/images/cloudmind_icon.png
